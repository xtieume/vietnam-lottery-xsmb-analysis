name: Update data

on:
  # Triggered only by the LaunchPad TV Cloudflare Worker cron (every 10 minutes,
  # 18:10-19:30 Vietnam time). GitHub's own schedule ran hours late, so it is gone.
  workflow_dispatch:

# Overlapping dispatches race on `git push`; run them one at a time instead.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Always build on main, whatever ref the run was dispatched from.
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Fetch data
        run: |
          for i in 1 2 3; do
            uv run src/fetch.py && exit 0
            echo "fetch attempt $i failed"
            [ "$i" = 3 ] && exit 1
            sleep 60
          done

      - name: Analyze data
        run: uv run src/analyze.py

      - name: Commit changes
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # main may move while we run (a merged PR). Outputs are fully derived, so on a
          # rejected push regenerate them on top of the new main instead of merging them.
          for i in 1 2 3; do
            git add data images README.md
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Updated $(date +'%Y-%m-%d')"
            git push origin HEAD:main && exit 0
            [ "$i" = 3 ] && exit 1
            echo "push attempt $i rejected, regenerating on the new main"
            sleep 10
            git fetch origin main
            git reset --hard origin/main
            uv run src/fetch.py
            uv run src/analyze.py
          done
